# Local/dev compose; run from the repo root: docker compose -f deploy/docker-compose.yml up
# The production variant lives in vps_deployment (see deploy/vps_deployment.md).
x-curator: &curator
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  env_file: ../.env
  volumes: [../data:/app/data]

services:
  ingest:
    <<: *curator
    command: ["curator-ingest", "run"]

  curate:
    <<: *curator
    command: ["curator-curate", "run"]

  web:
    <<: *curator
    command: ["curator-web"]
    ports: ["127.0.0.1:8000:8000"]
