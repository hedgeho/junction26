{% extends "base.html" %}
{% block body %}
<h1>Your attention, on your terms.</h1>
<p>A finite daily selection of original posts, connected to your own writing.</p>
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Bluesky handle <input name="handle" required maxlength="253" placeholder="you.bsky.social"></label>
<button>Sign in</button>
</form>
<p class="why">Bluesky identifies your account. The reader supports Bluesky and X posts supplied by the data pipeline.</p>
<a href="/privacy">Privacy</a>
{% endblock %}
