<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f2ec">
  <title>{% block title %}Agora{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23293f33'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <script src="/static/theme.js?v={{ asset_version }}"></script>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <script defer src="/static/app.js?v={{ asset_version }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Agora home"><svg class="brand-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M8 92H92V8H8V72H72V28H28V52" stroke="currentColor" stroke-width="10"/><circle cx="52" cy="52" r="7" fill="#FFB000"/></svg>Agora</a>
    <div class="header-actions">
    {% block header_extra %}{% endblock %}
    {% if request.session.get('did') %}
    <nav aria-label="Navigation">
      <a href="/me" {% if request.url.path == '/me' %}aria-current="page"{% endif %}>Feed</a>
      <a href="/settings" {% if request.url.path == '/settings' %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    {% endif %}
    <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><span aria-hidden="true">&#9680;</span><span class="theme-label">Theme</span></button>
    </div>
  </header>
  <main id="main"{% block main_attributes %}{% endblock %}>{% block body %}{% endblock %}</main>
</body>
</html>
