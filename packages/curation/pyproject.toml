[project]
name = "curator-curation"
version = "0.1.0"
description = "Quiet profiles, Gemini filtering and private Gemma matching"
requires-python = ">=3.12"
dependencies = [
    "curator-core",
    "pydantic>=2.14.3",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "tzdata>=2026.6",
]

[project.scripts]
curator-curate = "curator_curation.__main__:main"

[tool.uv.sources]
curator-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "curator_curation"
