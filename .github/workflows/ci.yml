name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: craci
    steps:
      - uses: cracicorp/setup@v1
        with:
          network: |
            default: deny
            presets: [github, pypi]
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: craci
    strategy:
      fail-fast: false
      matrix:
        package: [core, ingest, curation, web]
    steps:
      - uses: cracicorp/setup@v1
        with:
          network: |
            default: deny
            presets: [github, pypi]
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # --exact installs only this package's dependency closure, so an import
      # across an ownership boundary (e.g. ingest -> curation) fails here.
      - run: uv run --frozen --exact --package curator-${{ matrix.package }} --with pytest pytest -q packages/${{ matrix.package }}
