name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [core, ingest, curation, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # --exact installs only this package's dependency closure, so an import
      # across an ownership boundary (e.g. ingest -> curation) fails here.
      - run: uv run --frozen --exact --package curator-${{ matrix.package }} --with pytest pytest -q packages/${{ matrix.package }}

  # After lint and tests, so `latest` (which the production VPS cron follows) only moves on green.
  image:
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    uses: hedgeho/vps_deployment/.github/workflows/build-image.yml@master
    permissions: { contents: read, packages: write }
    secrets: inherit
    with: { dockerfile: deploy/Dockerfile }
