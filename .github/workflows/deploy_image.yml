name: Build & push image to ghcr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: craci
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: cracicorp/setup@v1
        with:
          network: |
            default: deny
            presets: [github, ghcr, pypi]
            connections:
              - tls:
                  serverNamePatterns: [pkg-containers.githubusercontent.com]
                  ports: [443]

      - uses: actions/checkout@v4

      - name: Login to GHCR, build and push
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker buildx build -f deploy/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --cache-from type=registry,ref="$IMAGE:buildcache" \
            --cache-to type=registry,ref="$IMAGE:buildcache",mode=max \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" \
            --push .
